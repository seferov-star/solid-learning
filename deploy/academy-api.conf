server {
 listen 80;
 server_name academy-api.hqserv.ru;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
 location / { return 308 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name academy-api.hqserv.ru;
 ssl_certificate /etc/letsencrypt/live/academy-api.hqserv.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/academy-api.hqserv.ru/privkey.pem;
 access_log off;
 client_max_body_size 128k;
 include /etc/nginx/conf.d/academy-realip.inc;
 add_header Strict-Transport-Security "max-age=86400" always;
 resolver 127.0.0.11 valid=30s ipv6=off;
 location / {
  set $academy http://solid-learning-api:8080;
  proxy_pass $academy;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 30s;
 }
}
