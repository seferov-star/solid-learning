server {
 listen 80;
 server_name academy.hqserv.ru;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
 location / { return 302 https://seferov-star.github.io/solid-learning/; }
}

server {
 listen 443 ssl;
 server_name academy.hqserv.ru;
 ssl_certificate /etc/letsencrypt/live/academy.hqserv.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/academy.hqserv.ru/privkey.pem;
 return 302 https://seferov-star.github.io/solid-learning/;
}
