services:
  api:
    image: ${ACADEMY_IMAGE}
    container_name: solid-learning-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    mem_limit: 512m
    cpus: 1.0
    environment:
      WEB_ORIGIN: https://seferov-star.github.io
      DB_PATH: /app/data/app.sqlite
    volumes:
      - ./data:/app/data
    networks: [edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
    external: true
    name: hqserv-edge
